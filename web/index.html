<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SequenceWarp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">Dynamic time warping</p>
        <h1>SequenceWarp</h1>
        <p>Measure alignment distance between sequences.</p>
      </header>
      <section class="panel">
        <label>Series A
          <input id="seriesA" value="1,2,3,2,1" />
        </label>
        <label>Series B
          <input id="seriesB" value="1,1,2,3,2" />
        </label>
        <button id="dtwButton">Compute</button>
      </section>
      <section class="panel">
        <h2>Result</h2>
        <div id="result" class="result"></div>
      </section>
    </main>
    <div class="warp"></div>
    <script src="app.js"></script>
  </body>
</html>
